services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5435:5432"
    volumes:
      - postgresDB:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      .
    depends_on:
      - db
    env_file: .env
    volumes: 
      - .:/app

volumes:
  postgresDB: